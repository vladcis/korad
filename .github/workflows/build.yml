name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pyinstaller:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: korad-linux-x86_64-web
            webview: "0"
          - os: windows-latest
            asset: korad-windows-x64.exe
            webview: "1"
          - os: macos-latest
            asset: korad-macos-arm64.zip
            webview: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Install pywebview (Windows/macOS)
        if: matrix.webview == '1'
        run: pip install pywebview
      - name: Build
        run: python build.py
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cp dist/korad "${{ matrix.asset }}" && chmod +x "${{ matrix.asset }}"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp dist/korad.exe "${{ matrix.asset }}"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent korad.app "../${{ matrix.asset }}"
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          KORAD_HOME=/tmp/korad-test ./${{ matrix.asset }} --server --port 8591 --no-autoconnect >/tmp/out.log 2>&1 &
          sleep 6
          curl -sf http://127.0.0.1:8591/api/state | head -c 300
          curl -sf http://127.0.0.1:8591/api/scripts | grep -q lib_batt
          cat /tmp/out.log
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: |
          V=0.0.0~dev
          case "$GITHUB_REF" in refs/tags/v*) V="${GITHUB_REF_NAME#v}";; esac
          sh packaging/linux/build_deb.sh "$V"
      - name: Smoke test (install, server, native window)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dist/korad_*_all.deb xvfb libgl1-mesa-dri
          KORAD_HOME=/tmp/kd korad --server --port 8592 --no-autoconnect >/tmp/s.log 2>&1 &
          sleep 6
          curl -sf http://127.0.0.1:8592/api/scripts | grep -q lib_batt || { cat /tmp/s.log; echo "::error title=deb server::$(tail -20 /tmp/s.log | awk '{printf "%s%%0A", $0}')"; exit 1; }
          # own data folder: with the same one the single-instance guard would just open the server above
          KORAD_HOME=/tmp/kd-gui xvfb-run -a timeout 30 korad --no-autoconnect >/tmp/g.log 2>&1 || true
          sh packaging/linux/check_window.sh /tmp/g.log deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/korad_*_all.deb

  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update -qq
          # libraries PyInstaller bundles into the AppImage (+ xvfb for the test)
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri $(cat packaging/linux/appimage-build-deps.txt)
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview qtpy PyQt6 PyQt6-WebEngine
      - name: Build AppImage
        run: sh packaging/linux/build_appimage.sh
      - name: Smoke test (native Qt window)
        run: |
          KORAD_HOME=/tmp/ka APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 40 \
            dist/korad-linux-x86_64.AppImage --no-autoconnect >/tmp/g.log 2>&1 || true
          sh packaging/linux/check_window.sh /tmp/g.log AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/korad-linux-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [pyinstaller, deb, appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: packaging/RELEASE_NOTES.md
          generate_release_notes: true
          files: assets/*
